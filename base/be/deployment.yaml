apiVersion: apps/v1
kind: Deployment
metadata:
  name: scg-backend-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scg-be
  template:
    metadata:
      labels:
        app: scg-be
    spec:
      containers:
      - name: be-v2-container
        image: scgskku/scg-home-be-prod:8726a3a698fb4cf07719c3ab35b335395ec5a6b0-29563903295-1
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: NODE_ENV
          value: "production"
        - name: TZ
          value: "Asia/Seoul"
